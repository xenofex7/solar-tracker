services:
  solar-tracker:
    image: ghcr.io/xenofex7/solar-tracker:latest
    build: .
    container_name: solar-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  solar-tracker-sync:
    image: ghcr.io/xenofex7/solar-tracker:latest
    container_name: solar-tracker-sync
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: sh -c "while true; do python -m scripts.sync_ha --days 3 --quiet; sleep 86400; done"
