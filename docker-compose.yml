services:
  solar-tracker:
    image: ghcr.io/xenofex7/solar-tracker:latest
    build: .
    container_name: solar-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  solar-tracker-sync:
    image: ghcr.io/xenofex7/solar-tracker:latest
    container_name: solar-tracker-sync
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      TZ: Europe/Zurich
    command: >
      sh -c 'while true; do
        now=$$(date +%s); at=$$(date -d 03:15 +%s);
        [ $$at -le $$now ] && at=$$(date -d "tomorrow 03:15" +%s);
        sleep $$(( at - now ));
        python -m scripts.sync_ha --days 3 --quiet;
      done'
