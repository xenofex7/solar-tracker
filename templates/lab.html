{% extends "base.html" %}
{% block title %}Chart-Lab · Solar-Tracker{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Chart-Lab <span class="muted">Preview</span></h1>
  <div class="header-filter">
    <label for="year-select">{{ T.label_year }}</label>
    <select id="year-select">
      <option value="all">{{ T.option_all }}</option>
      {% for y in years %}
        <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
      {% endfor %}
    </select>
    <span class="muted" id="status"></span>
  </div>
</div>

<section class="grid">
  <div class="card wide">
    <h3>3 · Self-sufficiency vs. self-consumption rate</h3>
    <canvas id="lab-autarky"></canvas>
  </div>
</section>

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/lab.js') }}"></script>
{% endblock %}
