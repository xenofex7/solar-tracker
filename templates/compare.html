{% extends "dash.html" %}
{% block title %}{{ T[page_title_key] }} · Solar-Tracker{% endblock %}
{% block dash_content %}
<section class="grid">
  <div class="card">
    <h3>{{ T.chart_yearcomp_title }}</h3>
    <canvas id="chart-yearcomp" role="img" aria-label="{{ T.chart_yearcomp_title }}"></canvas>
  </div>
  <div class="card">
    <h3>{{ T.chart_spec_yield_title }}</h3>
    <canvas id="chart-spec-yield" role="img" aria-label="{{ T.chart_spec_yield_title }}"></canvas>
  </div>
  <div class="card wide">
    <h3>{{ T.chart_deviation_title }}</h3>
    <canvas id="chart-deviation" role="img" aria-label="{{ T.chart_deviation_title }}"></canvas>
  </div>
</section>
{% endblock %}
