{% extends "dash.html" %}
{% block title %}{{ T[page_title_key] }} · Solar-Tracker{% endblock %}
{% block dash_content %}
<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="card wide">
    <h3>{{ T.chart_monthly_title }}</h3>
    <canvas id="chart-monthly" role="img" aria-label="{{ T.chart_monthly_title }}"></canvas>
  </div>
  <div class="card wide">
    <h3>{{ T.chart_cumulative_title }}</h3>
    <canvas id="chart-cumulative" role="img" aria-label="{{ T.chart_cumulative_title }}"></canvas>
  </div>
</section>
{% endblock %}
