{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>{{ T[page_title_key] }}</h1>
  <div class="header-filter">
    <label for="year-select">{{ T.label_year }}</label>
    <select id="year-select" data-auto-sync="{{ '1' if auto_sync_on_open and is_admin else '0' }}" data-sync-source="{{ sync_source }}">
      <option value="all">{{ T.option_all }}</option>
      {% for y in years %}
        <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
      {% endfor %}
    </select>
    <span class="muted" id="status"></span>
  </div>
</div>

{% block dash_content %}{% endblock %}

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
